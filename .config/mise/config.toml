min_version = "2026.6.12"

[settings]
lockfile = true

[env]
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_NOLOGO = "1"

[tools]
gitleaks = "8.30.1"
syft = "1.49.0"

[tasks.install]
description = "Install pinned project tools and restore dependencies"
run = """
mise install
dotnet tool restore
mise run csharp:restore
"""

[tasks.lock]
description = "Refresh mise.lock after tool-version changes"
run = "mise lock"

[tasks.doctor]
description = "Inspect mise configuration and installed tools"
run = "mise doctor"

[tasks.tasks]
description = "List available project tasks"
run = "mise tasks"

[tasks.secrets]
description = "Scan the working tree for secrets"
run = "gitleaks dir . --redact --no-banner"

[tasks.sbom]
description = "Generate a CycloneDX JSON SBOM for the project filesystem"
run = """
set -eu
source_name="${SYFT_SOURCE_NAME:-$(basename "$PWD")}"
source_version="${SYFT_SOURCE_VERSION:-0.0.0}"
export SYFT_CHECK_FOR_APP_UPDATE="${SYFT_CHECK_FOR_APP_UPDATE:-false}"
rm -rf sbom
mkdir -p sbom
syft scan dir:. --source-name "$source_name" --source-version "$source_version" --exclude ./sbom --exclude ./.git --output cyclonedx-json=sbom/sbom.cdx.json
"""

[tasks.fmt]
description = "Format the project"
depends = ["csharp:fmt"]

[tasks."fmt:check"]
description = "Check formatting"
depends = ["csharp:fmt:check"]

[tasks.lint]
description = "Build with analyzers"
depends = ["csharp:lint"]

[tasks.test]
description = "Run the normal test suite"
depends = ["csharp:test"]

[tasks.standards]
description = "Run standards workflows and available autofixes"
depends = ["csharp:standards"]

[tasks."standards:check"]
description = "Run the standards CI gate"
depends = ["secrets", "csharp:standards:check"]

[tasks.check]
description = "Run the normal local gate"
depends = ["csharp:standards:check"]

[tasks.ci]
description = "Run the CI gate"
depends = ["standards:check"]

[tasks.dev]
description = "Run the Aspire AppHost"
depends = ["csharp:tools:restore"]
run = "dotnet tool run aspire -- run --apphost src/Launchpad.AppHost/Launchpad.AppHost.csproj"
