[tools]
dotnet = "10.0.302"

[tasks."csharp:restore"]
description = "Restore .NET dependencies"
run = "dotnet restore"

[tasks."csharp:tools:restore"]
description = "Restore local .NET tools"
run = "dotnet tool restore"

[tasks."csharp:fmt"]
description = "Format C# code"
depends = ["csharp:restore"]
run = "dotnet format --no-restore"

[tasks."csharp:fmt:check"]
description = "Check C# formatting"
depends = ["csharp:restore"]
run = "dotnet format --verify-no-changes --no-restore"

[tasks."csharp:lint"]
description = "Build C# with analyzers enabled"
depends = ["csharp:restore"]
wait_for = ["csharp:fmt:check"]
run = "dotnet build --no-restore --configuration Release -warnaserror -p:ContinuousIntegrationBuild=true -p:TreatWarningsAsErrors=true"

[tasks."csharp:test"]
description = "Run unit and integration tests"
depends = ["csharp:restore"]
wait_for = ["csharp:lint"]
run = "dotnet test tests/Launchpad.Tests/Launchpad.Tests.csproj --no-restore --configuration Release --results-directory TestResults -- --report-trx"

[tasks."csharp:test:e2e"]
description = "Run Playwright smoke tests against LAUNCHPAD_E2E_URL"
depends = ["csharp:restore"]
run = "dotnet test tests/Launchpad.PlaywrightTests/Launchpad.PlaywrightTests.csproj --no-restore --configuration Release --results-directory TestResults/Playwright -- --report-trx"

[tasks."csharp:ef"]
description = "Run dotnet-ef"
depends = ["csharp:restore", "csharp:tools:restore"]
run = "dotnet tool run dotnet-ef --"

[tasks."csharp:aspire"]
description = "Run the Aspire CLI"
depends = ["csharp:tools:restore"]
run = "dotnet tool run aspire --"

[tasks."csharp:standards"]
description = "Run the C# standards workflow with autofixes"
depends = ["csharp:fmt"]

[tasks."csharp:standards:check"]
description = "Run the C# standards CI gate"
depends = ["csharp:fmt:check", "csharp:lint", "csharp:test"]

[tasks."csharp:check"]
description = "Alias for the C# standards gate"
depends = ["csharp:standards:check"]

[tasks."csharp:ci"]
description = "Alias for the C# standards gate"
depends = ["csharp:standards:check"]
